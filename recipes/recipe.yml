---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# Imagem publicada em ghcr.io/marcusmt/nvidia-basic
name: nvidia-basic
description: Fedora Kinoite (KDE atômico) + driver aberto da NVIDIA, sem extras.

# Kinoite oficial com o nvidia-open já embutido (mantido pelo BlueBuild).
# Versão fixada: troca de Fedora só quando mudar este número.
base-image: ghcr.io/blue-build/base-images/fedora-kinoite-nvidia-open
image-version: 45

modules:
  # Copia files/system/* para a raiz da imagem (configs próprias vão aqui).
  - type: files
    files:
      - source: system
        destination: /

  # Pacotes do sistema. Cada linha com o motivo ao lado.
  # Só coloque em "remove" pacotes que existem na imagem (veja o README),
  # senão a compilação falha.
  # - type: dnf
  #   install:
  #     packages:
  #       - htop        # exemplo: monitor no terminal
  #   remove:
  #     packages:
  #       - firefox     # exemplo: trocar pelo Flatpak
  #       - firefox-langpacks

  # Só habilita o Flathub, sem instalar nenhum app.
  - type: default-flatpaks
    configurations:
      - scope: system

  # Política e chave pra rodar a imagem assinada.
  - type: signing
