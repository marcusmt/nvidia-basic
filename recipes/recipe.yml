---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# Image is published to ghcr.io/marcusmt/nvidia-basic
name: nvidia-basic
description: Debloated Fedora Kinoite with the open NVIDIA driver, fish, Alacritty, Helium and Claude Desktop.

# Official Kinoite with nvidia-open baked in (maintained by BlueBuild).
# Pinned version: Fedora only changes when this number changes.
base-image: ghcr.io/blue-build/base-images/fedora-kinoite-nvidia-open
image-version: 45

modules:
  # Workarounds for removals that failed the dnf transaction in the CI build.
  - type: script
    snippets:
      # /var and /run start empty in the build; RPM errored on these missing
      # paths of packages removed below (hplip, qemu-guest-agent, Hyper-V).
      - mkdir -p /var/lib/hp /run/hplip /var/log/qemu-ga /var/lib/hyperv
      # Akonadi (the Kontact/KMail backend, unused): its %postun
      # (update-alternatives --remove) exits 2 in CI. Nothing requires these
      # two, so remove them without scriptlets and drop their alternatives.
      - >-
        rpm -e --noscripts akonadi-server-mysql akonadi-server &&
        rm -f /etc/alternatives/akonadiserverrc /etc/xdg/akonadi/akonadiserverrc
        /etc/alternatives-admindir/akonadiserverrc &&
        rmdir --ignore-fail-on-non-empty /etc/xdg/akonadi

  # System packages, one per line with the reason next to it. Packages that
  # aren't in the image are skipped, so check names with `rpm -q` first.
  - type: dnf
    repos:
      cleanup: true          # don't leave the COPR enabled in the image
      copr:
        - imput/helium       # official Helium COPR
    install:
      packages:
        - fish               # shell for the terminal (login shell stays bash)
        - alacritty          # terminal, no GTK/Qt
        - helium-bin         # browser (replaces Firefox)
        # runtime deps of Strata (file manager, installed per-user by its
        # own installer, which does not install deps outside Arch)
        - gtksourceview5
        - poppler-glib
        - ffmpeg-free
        - ffmpegthumbnailer
        - gstreamer1-plugin-libav
        # Claude Desktop (installed by claude-desktop.sh below)
        - binutils           # `ar`, to unpack the .deb
        - qemu-system-x86-core  # Cowork runs its tasks in a QEMU/KVM VM
        - edk2-ovmf
        - virtiofsd
    remove:
      packages:
        # VM guest tools: this runs on bare metal
        - hyperv-daemons     # metapackage only; its daemons are listed below
        - hypervkvpd
        - hypervvssd
        - hypervfcopyd
        - hyperv-daemons-license
        - open-vm-tools
        - open-vm-tools-desktop
        - qemu-guest-agent
        - spice-vdagent
        - spice-webdavd
        - virtualbox-guest-additions
        # Asian input methods (ibus stays; fcitx5 itself goes too, only mozc needed it)
        - ibus-anthy
        - ibus-anthy-python
        - ibus-chewing
        - ibus-hangul
        - ibus-libpinyin
        - ibus-m17n
        - ibus-typing-booster
        - fcitx5-mozc
        - fcitx5-chinese-addons
        - fcitx5-chinese-addons-data
        - fcitx5-hangul
        - fcitx5-unikey
        - fcitx5-sayura
        - fcitx5-libthai
        # KDE extras
        - plasma-welcome
        - khelpcenter
        - kwalletmanager5
        - kdebugsettings
        - kjournald
        - kcharselect
        - kfind
        - dolphin            # replaced by Strata
        - dolphin-libs
        - dolphin-plugins
        - konsole            # replaced by Alacritty
        - konsole-part
        - kate               # replaced by Zed
        - kate-libs
        - kate-plugins
        - kate-krunner-plugin
        - kwrite             # (kwrited, the write(1) daemon, stays: plasma-desktop needs it)
        - filelight
        - kde-partitionmanager
        - plasma-drkonqi
        - kde-connect
        - kde-connect-libs
        - kdeconnectd
        - krfb
        - krfb-libs
        # (Akonadi is removed by the script at the top)
        # Printer/scanner drivers (driverless IPP via cups stays)
        - hplip
        - gutenprint
        - gutenprint-cups
        - sane-backends-drivers-scanners
        - sane-backends-drivers-cameras
        # No cellular modem / Bluetooth tethering
        # (ModemManager-glib stays: geoclue2 and fwupd link against it)
        - ModemManager
        - NetworkManager-wwan
        - NetworkManager-bluetooth
        # SMB server (client stays)
        - samba
        - samba-usershares
        # Misc
        - htop
        - firewall-config
        - toolbox            # distrobox stays
        - firefox            # browser is Helium
        - firefox-langpacks

  # Official Claude Desktop (Linux beta). Anthropic only ships a .deb; the
  # script verifies it against Anthropic's signing key and unpacks it into
  # /usr. Each image build picks up the newest release.
  - type: script
    scripts:
      - claude-desktop.sh

  # Only enables Flathub, installs no apps.
  - type: default-flatpaks
    configurations:
      - scope: system

  # Policy and key needed to run the signed image.
  - type: signing
