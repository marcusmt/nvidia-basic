---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# Image is published to ghcr.io/marcusmt/nvidia-basic
name: nvidia-basic
description: Fedora Kinoite (atomic KDE) + open NVIDIA driver, no extras.

# Official Kinoite with nvidia-open baked in (maintained by BlueBuild).
# Pinned version: Fedora only changes when this number changes.
base-image: ghcr.io/blue-build/base-images/fedora-kinoite-nvidia-open
image-version: 45

modules:
  # Copies files/system/* into the image root (custom configs go here).
  - type: files
    files:
      - source: system
        destination: /

  # System packages. One per line, with the reason next to it.
  # Only list packages under "remove" that exist in the image (see README),
  # otherwise the build fails.
  - type: dnf
    repos:
      copr:
        - imput/helium       # official Helium COPR
    install:
      packages:
        - fish               # shell for the terminal (login shell stays bash)
        - alacritty          # terminal, no GTK/Qt
        - helium-bin         # browser (replaces Firefox)
        # runtime deps of Strata (file manager, installed per-user by its
        # own installer, which does not install deps outside Arch)
        - gtksourceview5
        - poppler-glib
        - ffmpeg-free
        - ffmpegthumbnailer
        - gstreamer1-plugin-libav
    remove:
      packages:
        # VM guest tools: this runs on bare metal
        - hyperv-daemons
        - open-vm-tools
        - open-vm-tools-desktop
        - qemu-guest-agent
        - spice-vdagent
        - spice-webdavd
        - virtualbox-guest-additions
        # Asian input methods (base ibus/fcitx5 stay for the keyboard)
        - ibus-anthy
        - ibus-anthy-python
        - ibus-chewing
        - ibus-hangul
        - ibus-libpinyin
        - ibus-m17n
        - ibus-typing-booster
        - fcitx5-mozc
        - fcitx5-chinese-addons
        - fcitx5-chinese-addons-data
        - fcitx5-hangul
        - fcitx5-unikey
        - fcitx5-sayura
        - fcitx5-libthai
        # KDE extras
        - plasma-welcome
        - khelpcenter
        - kwalletmanager5
        - kdebugsettings
        - kjournald
        - kcharselect
        - kfind
        - dolphin            # replaced by Strata
        - dolphin-libs
        - dolphin-plugins
        - filelight
        - kde-partitionmanager
        - plasma-drkonqi
        - kde-connect
        - kde-connect-libs
        - kdeconnectd
        - krfb
        - krfb-libs
        # Kontact/KMail backend, not used
        - akonadi-server
        - akonadi-server-mysql
        # Printer/scanner drivers (driverless IPP via cups stays)
        - hplip
        - gutenprint
        - gutenprint-cups
        - sane-backends-drivers-scanners
        - sane-backends-drivers-cameras
        # No cellular modem / Bluetooth tethering
        # (ModemManager-glib stays: geoclue2 and fwupd link against it)
        - ModemManager
        - NetworkManager-wwan
        - NetworkManager-bluetooth
        # SMB server (client stays)
        - samba
        - samba-usershares
        # Misc
        - htop
        - firewall-config
        - toolbox            # distrobox stays
        - firefox            # browser is Helium
        - firefox-langpacks

  # Only enables Flathub, installs no apps.
  - type: default-flatpaks
    configurations:
      - scope: system

  # Policy and key needed to run the signed image.
  - type: signing
