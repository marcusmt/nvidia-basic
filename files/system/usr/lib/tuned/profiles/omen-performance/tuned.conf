# Used by the "Performance" power profile (see /etc/tuned/ppd.conf).
# throughput-performance is a server profile: dirty_ratio=40 lets ~12 GB of
# writes pile up in RAM before they hit the disk. Cap that at 256 MB.
[main]
summary=throughput-performance with desktop-friendly writeback
include=throughput-performance

[vm]
dirty_bytes=268435456
dirty_background_bytes=67108864

[sysctl]
# frees a CPU performance counter; hard-lockup detection is lost
kernel.nmi_watchdog=0
