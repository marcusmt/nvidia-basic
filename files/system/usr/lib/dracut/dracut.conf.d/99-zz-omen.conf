# Omen in dGPU (MUX) mode: the RTX 4090 is the only GPU. Replaces the
# force_drivers of 99-nvidia.conf (base image), so the initramfs drops
# i915/amdgpu/nouveau and their firmware: 308 MB -> 173 MB, initrd 9.6 s -> 5.5 s.
force_drivers=" nvidia nvidia_drm nvidia_modeset nvidia_uvm "
omit_drivers+=" amdgpu radeon nouveau nvidia_peermem "
